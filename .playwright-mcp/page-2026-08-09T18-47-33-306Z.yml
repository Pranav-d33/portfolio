              - generic [ref=f12e201]: integrate
              - generic [ref=f12e206]:
                - generic [ref=f12e207]: "01"
                - text: Born in Asia, raised by the world — monopo is the global fulcrum between East and West. We blur boundaries of difference, creating design that stands the test of time.
            - generic [ref=f12e208]:
              - generic [ref=f12e209]: COLLABORATE
              - generic [ref=f12e214]:
                - generic [ref=f12e215]: "02"
                - text: Collaboration over competition — Creativity, for monopo saigon, is like having a nabe with friends where we combine the creativity that sets us apart. Through collaborative initiative, we bring your visions to fruition.
            - generic [ref=f12e216]:
              - generic [ref=f12e217]: CHALLENGE
              - generic [ref=f12e222]:
                - generic [ref=f12e223]: "03"
                - text: We create to evoke — We start where others stop, we question the norms, we refuse to be redundant, monopo saigon seeks to deliver original creative solutions.
