            - paragraph [ref=f12e251]: From Tokyo to Saigon, We come from all over the world
            - list [ref=f12e252]:
              - listitem [ref=f12e253]:
                - generic [ref=f12e254]:
                  - generic [ref=f12e255]: Branch Director, CREATIVE Director
                  - generic:
                    - generic [ref=f12e256]: VickiDang
                    - button [ref=f12e258]
                  - paragraph [ref=f12e260]:
                    - generic: Vicki Dang a.k.a Wii-ki is a self-taught 3D motion designer/director. Originally from Saigon, She has been working as a 3D Animator and Art director ever since. Her clients are Maserati, Louis Vuitton, Nike China, IKEA, MOAG, Oppo, Musiversal, FreeFire... She aims to create unconventional visual dimensions for digital spaces while implementing diverse cultural identities for the new generations. Deconstructing the concept of "westernizing" and "localizing," Vicki seeks to implement unbounded creativity and craftsmanship into the work.
                    - list [ref=f12e261]:
                      - listitem [ref=f12e262]:
                        - link "Ig" [ref=f12e263] [cursor=pointer]:
                          - /url: https://www.instagram.com/wiikiiiiii/
                        - link "Web" [ref=f12e264] [cursor=pointer]:
                          - /url: https://www.wiikivicki.com/
                  - generic [ref=f12e265]: ( 1 )
              - listitem [ref=f12e266]:
                - generic [ref=f12e267]:
                  - generic [ref=f12e268]: Branch Director, FiLM Director
                  - generic:
                    - generic [ref=f12e269]: RobinMahieux
                    - button [ref=f12e271]
                  - paragraph [ref=f12e273]:
                    - generic: Robin is a multi-disciplinary artist focused on Film Direction and Creative direction. Although he grew up in a multicultural family, he has found his home in Asia. Fascinated by traditions and the ever-growing youth culture, Robin focuses on creating compelling storytelling and immersive experiences. Robin has been directing worldwide for international brands (Louis Vuitton, Adidas, Cartier, Onitsuka Tiger...) and renowned artists (Kiko Mizuhara, Son Tung MTP, AngelaBaby, Jessica Jung, Henry Lau…).
                    - list [ref=f12e274]:
