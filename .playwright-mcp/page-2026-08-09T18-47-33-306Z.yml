                  - generic [ref=f12e278]: ( 2 )
              - listitem [ref=f12e279]:
                - generic [ref=f12e280]:
                  - generic [ref=f12e281]: CEO & Co-Founder of monopo inc. / monopo Tokyo
                  - generic:
                    - generic [ref=f12e282]: YoshiyukiSasaki
                    - button [ref=f12e284]
                  - paragraph [ref=f12e286]:
                    - generic: Yoshi started out as a professional bassist before he went on co-found monopo while attending Waseda University (Tokyo, Japan) with fellow bassist Shun. At monopo, Yoshiyuki leads the groups client and talent expansion, as well as business development including founding poweredby.tokyo (2016), monopo London (2019), monopo New York (2021) and monopo Saigon (2021).
                    - list [ref=f12e287]:
                      - listitem [ref=f12e288]:
                        - link "Ig" [ref=f12e289] [cursor=pointer]:
                          - /url: https://www.instagram.com/yoshi.sasaki/
                        - link "Tw" [ref=f12e290] [cursor=pointer]:
                          - /url: https://twitter.com/yossysasaki
                  - generic [ref=f12e291]: ( 3 )
              - listitem [ref=f12e292]:
                - generic [ref=f12e293]:
                  - generic [ref=f12e294]: COO, CTO & Co-Founder of monopo inc. / monopo Tokyo
                  - generic:
                    - generic [ref=f12e295]: ShunOkada
                    - button [ref=f12e297]
                  - paragraph [ref=f12e299]:
                    - generic: Shun co-founded monopo in 2011 alongside his friend Yoshiyuki who he met in band club whilst studying at Waseda University in Tokyo. With his profound knowledge of web marketing, system development and technology, Shun consults our clients to help them achieve their communication goals. Shun is a natural problem solver, whether it’s in sales, new technologies or branding initiatives, he seeks to find creative solutions.
                    - list [ref=f12e300]:
                      - listitem [ref=f12e301]:
                        - link "Ig" [ref=f12e302] [cursor=pointer]:
                          - /url: https://www.instagram.com/shun.okada/
                        - link "Tw" [ref=f12e303] [cursor=pointer]:
                          - /url: https://twitter.com/shun_okada
                  - generic [ref=f12e304]: ( 4 )
              - listitem [ref=f12e305]:
                - generic [ref=f12e306]:
                  - generic [ref=f12e307]: Global Development Director of monopo inc.
                  - generic:
                    - generic [ref=f12e308]: GeorgiRoberts
                    - button [ref=f12e310]
                  - paragraph [ref=f12e312]:
                    - generic: British born, South African raised, Japan nurtured. Georgi studied film and media at the University of Cape Town before diving into a career spanning across theatre/film production management and advertising from London to Tokyo. Since moving to Tokyo in 2015, she has been working as a producer in the Japanese advertising industry. At monopo Tokyo, Georgi leads global campaigns/branding for various clients, as well as directing the monopo's international expansion.
                    - list [ref=f12e313]:
                      - listitem [ref=f12e314]:
                        - link "Ig" [ref=f12e315] [cursor=pointer]:
                          - /url: https://www.instagram.com/georgi.roberts/
                  - generic [ref=f12e316]: ( 5 )
              - listitem [ref=f12e317]:
                - generic [ref=f12e318]:
                  - generic [ref=f12e319]: ART DIRECTOR, DESIGNER OF MONOPO TOKYO
                  - generic:
                    - generic [ref=f12e320]: Tran MinhVillageois
                    - button [ref=f12e322]
                  - paragraph [ref=f12e324]:
                    - generic: Tran Minh is an art director and designer at monopo, born in France and based in Tokyo. He has a master degree in digital communication where he established his skills in web development, product design and digital marketing. Tran is passionate about experimenting with motion design and always willing to explore alongside ever-changing technology. As an art director, what matters most to him is to communicate messages that speak to human experiences or even social issues that are shared in societies across the world.
